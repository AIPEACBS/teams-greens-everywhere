name: Validate userscript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/schedule.test.js
      - run: node tools/build-userscript.mjs
      - run: node --check dist/teams-greens-everywhere.user.js
      - run: git diff --exit-code -- dist/teams-greens-everywhere.user.js
      - uses: actions/upload-artifact@v4
        with:
          name: teams-greens-everywhere-userscript
          path: dist/teams-greens-everywhere.user.js
